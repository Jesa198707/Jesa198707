<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Actividad en GitHub</title>
  <desc id="desc">Tarjeta de actividad. 157 contribuciones y 147 commits desde 29 oct 2025, 9 repositorios (8 privados), 18 días con actividad. Racha actual: 1 días. Racha más larga: 3 días (26 – 28 oct 2026).</desc>
  <style>
