  <title id="title">Stack tecnológico</title>
  <desc id="desc">Panel animado con cuatro columnas que se iluminan en ola. Lenguajes: Java, Python, C#, SQL. Backend y web: Node.js, Express, Nginx. Sistemas: Linux, Docker, Samba. Red y seguridad: WireGuard, TLS / HTTPS, bastionado.</desc>
