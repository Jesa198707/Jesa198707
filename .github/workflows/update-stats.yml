name: Actualizar estadísticas

on:
  schedule:
    - cron: "17 5 * * *" # cada día a las 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar estadísticas
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python .github/scripts/fetch_stats.py "$RUNNER_TEMP/stats.json"

      - name: Regenerar tarjeta
        run: python .github/scripts/render_svgs.py assets/readme --only stats --stats "$RUNNER_TEMP/stats.json"

      - name: Commit si hay cambios
        run: |
          if git diff --quiet -- assets/readme/stats.svg; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/stats.svg
          git commit -m "Actualizar estadísticas del perfil"
          git push
